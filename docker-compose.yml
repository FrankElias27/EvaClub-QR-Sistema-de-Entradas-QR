services:
  postgres:
    container_name: postgres-sql-evaclub
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: evaclub
    volumes:
      - postgres:/var/lib/postgresql/data

    ports:
      - 5434:5432
    networks:
      - evaclub
    restart: unless-stopped

  keycloak:
    container_name: keycloak-evaclub
    image: quay.io/keycloak/keycloak:26.0.0
    ports:
      - 9090:8080
    depends_on:
      - postgres-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    networks:
      - evaclub
    command:
      - "start-dev" # se debe cambiar en producción

  postgres-keycloak:
    container_name: postgres-sql-keycloak
    image: postgres
    environment:
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: keycloak
    volumes:
      - postgres-keycloak:/var/lib/postgresql/data
      - ./init-db/initKeycloak.sql:/docker-entrypoint-initdb.d/initKeycloak.sql
    ports:
      - 5435:5432
    networks:
      - evaclub
    restart: unless-stopped

  sonarqube:
    container_name: sonar-evaclub
    image: sonarqube
    ports:
      - "9000:9000"
    depends_on:
      - postgres-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: true
      SONAR_JDBC_URL: ${SONAR_JDBC_URL}
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD}
    networks:
      - evaclub

  postgres-sonarqube:
    container_name: postgres-sql-sonarqube
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER_SONAR}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_SONAR}
      POSTGRES_DB: ${POSTGRES_DB_SONAR}
    volumes:
      - postgres-sonarqube:/var/lib/postgresql/data
      - ./init-db/initSonar.sql:/docker-entrypoint-initdb.d/initSonar.sql
    ports:
      - 5436:5432
    networks:
      - evaclub
    restart: unless-stopped


networks:
  evaclub:
    driver: bridge

volumes:
  postgres:
    driver: local
  keycloak:
    driver: local
  postgres-keycloak:
    driver: local
  postgres-sonarqube:
    driver: local