services:
  postgres:
    container_name: postgres-sql-evaclub
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: evaclub
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-db/initKeycloak.sql:/docker-entrypoint-initdb.d/initKeycloak.sql
    ports:
      - 5434:5432
    networks:
      - evaclub
    restart: unless-stopped

  keycloak:
    container_name: keycloak-evaclub
    image: quay.io/keycloak/keycloak:26.0.0
    ports:
      - 9090:8080
    depends_on:
      - postgres
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    networks:
      - evaclub
    command:
      - "start-dev"

networks:
  evaclub:
    driver: bridge

volumes:
  postgres:
    driver: local
  keycloak:
    driver: local